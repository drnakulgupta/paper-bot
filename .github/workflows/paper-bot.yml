name: paper-bot

on:
  schedule:
    - cron: "5 * * * *"   # every hour, 5 min past
  workflow_dispatch:
    inputs:
      mode:
        description: "live or backtest"
        default: "backtest"
        type: choice
        options: [backtest, live]

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run bot
        run: python bot.py ${{ github.event.inputs.mode || 'live' }}
      - name: Save results
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "bot update" && git push)
